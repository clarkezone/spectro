name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-and-test:
    runs-on: windows-2022
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.x'

      - name: Locate MSBuild
        shell: pwsh
        run: |
          $msbuild = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -requires Microsoft.Component.MSBuild -find MSBuild\**\Bin\MSBuild.exe | Select-Object -First 1
          if (-not $msbuild) { throw "MSBuild not found on runner." }
          "MSBUILD_EXE=$msbuild" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Restore dependencies
        run: |
          dotnet restore src/NewsBlurSharp.TestsCore/NewsBlurSharp.TestsCore.csproj
          dotnet restore src/Spectro.ViewModels.Tests/Spectro.ViewModels.Tests.csproj

      - name: Build
        run: |
          dotnet build src/NewsBlurSharp.TestsCore/NewsBlurSharp.TestsCore.csproj --no-restore --configuration Release
          dotnet build src/Spectro.ViewModels.Tests/Spectro.ViewModels.Tests.csproj --no-restore --configuration Release

      - name: Build UWP app (MSBuild)
        shell: pwsh
        run: '& "$env:MSBUILD_EXE" src/Spectro/Spectro.csproj /restore /t:Build /p:Configuration=Release /p:Platform=x64 /p:EnableWindowsTargeting=true /m'

      - name: Test
        run: |
          dotnet test src/NewsBlurSharp.TestsCore/NewsBlurSharp.TestsCore.csproj --no-build --no-restore --configuration Release --verbosity normal
          dotnet test src/Spectro.ViewModels.Tests/Spectro.ViewModels.Tests.csproj --no-build --no-restore --configuration Release --verbosity normal
