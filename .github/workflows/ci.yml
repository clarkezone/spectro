name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    name: Deterministic tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.401
      - name: Test NewsBlur contracts
        run: dotnet test src\NewsBlurSharp.TestsCore\NewsBlurSharp.TestsCore.csproj -c Release
      - name: Test view models
        run: dotnet test src\Spectro.ViewModels.Tests\Spectro.ViewModels.Tests.csproj -c Release
      - name: Test SQLite repositories
        run: dotnet test src\Spectro.Infrastructure.Tests\Spectro.Infrastructure.Tests.csproj -c Release
      - name: Test offline synchronization
        run: dotnet test src\Spectro.Sync.Tests\Spectro.Sync.Tests.csproj -c Release

  winui-build:
    name: WinUI x64 Debug
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.401
      - name: Build packaged WinUI app
        run: dotnet build src\Spectro.App\Spectro.App.csproj -c Debug -p:Platform=x64

  native-aot:
    name: MSIX ${{ matrix.platform }} (Native AOT)
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x64
            runtime: win-x64
          - platform: ARM64
            runtime: win-arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.401
      - uses: microsoft/setup-WinAppCli@v0.1
        with:
          version: v0.6.1
      - name: Locate Visual C++ environment
        id: vcvars
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installation = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $installation) {
            throw "Visual Studio C++ build tools were not found."
          }
          "installation=$installation" >> $env:GITHUB_OUTPUT
      - name: Publish Native AOT
        shell: cmd
        run: |
          set "PATH=%PATH%;%ProgramFiles(x86)%\Microsoft Visual Studio\Installer"
          call "${{ steps.vcvars.outputs.installation }}\VC\Auxiliary\Build\vcvarsall.bat" ${{ matrix.platform == 'ARM64' && 'amd64_arm64' || 'amd64' }}
          if errorlevel 1 exit /b %errorlevel%
          dotnet publish src\Spectro.App\Spectro.App.csproj -c Release -p:Platform=${{ matrix.platform }} -r ${{ matrix.runtime }} --self-contained true
      - name: Package and sign test MSIX
        shell: pwsh
        run: |
          .\tools\New-SpectroMsix.ps1 -Runtime ${{ matrix.runtime }} `
            -OutputDirectory .\artifacts\msix\${{ matrix.runtime }} `
            -PackageVersion "1.0.${{ github.run_number }}.${{ github.run_attempt }}"
      - name: Verify x64 MSIX install and launch
        if: matrix.platform == 'x64'
        shell: pwsh
        run: |
          $package = Get-ChildItem .\artifacts\msix\${{ matrix.runtime }}\*.msix
          $certificate = Get-ChildItem .\artifacts\msix\${{ matrix.runtime }}\*.cer
          if ($package.Count -ne 1 -or $certificate.Count -ne 1) {
            throw "Expected exactly one package and public test certificate."
          }
          .\tools\Test-SpectroMsix.ps1 -PackagePath $package.FullName -CertificatePath $certificate.FullName
      - name: Upload installable test build
        uses: actions/upload-artifact@v4
        with:
          name: spectro-${{ matrix.runtime }}-msix
          path: |
            artifacts\msix\${{ matrix.runtime }}\*.msix
            artifacts\msix\${{ matrix.runtime }}\*.cer
            artifacts\msix\${{ matrix.runtime }}\INSTALL.md
          if-no-files-found: error
          retention-days: 14
